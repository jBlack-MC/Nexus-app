<svg viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nexusTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="nexusTitle">Nexus</title>

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="158" height="158" rx="31"/>
    </clipPath>
  </defs>

  <!-- ===================== ICON ===================== -->
  <g transform="translate(80,10)">

    <rect x="1" y="1" width="158" height="158" rx="31" fill="#0A0A0F" stroke="#1F1F27" stroke-width="1"/>

    <g clip-path="url(#frameClip)">

      <!-- ambient breathing glow, loops independently -->
      <circle cx="80" cy="80" r="66" fill="url(#glowGrad)">
        <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
          keyTimes="0;0.5;1" values="0.10;0.20;0.10"
          calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
        <animate attributeName="r" dur="4.5s" repeatCount="indefinite"
          keyTimes="0;0.5;1" values="66;71;66"
          calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </circle>

      <!-- ============ connected mark: spin -> scatter -> draw ============ -->
      <g id="connected">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
          keyTimes="0;0.3625;0.38125;1" values="1;1;0;0"/>

        <!-- connecting lines -->
        <line x1="30" y1="30" x2="30" y2="130" stroke="#22C55E" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="100">
          <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.19375;0.23375;1" values="100;100;0;0"/>
        </line>
        <line x1="30" y1="30" x2="130" y2="130" stroke="url(#grad)" stroke-linecap="round"
              stroke-dasharray="142">
          <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.23375;0.27875;1" values="142;142;0;0"/>
          <animate attributeName="stroke-width" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.31875;0.340625;0.3625;1" values="6;6;7;6;6"/>
        </line>
        <line x1="130" y1="30" x2="130" y2="130" stroke="#A855F7" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="100">
          <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.27875;0.31875;1" values="100;100;0;0"/>
        </line>

        <!-- four scattering dots -->
        <circle r="9" fill="#A855F7">
          <animate attributeName="cx" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.09375;0.145313;0.1625;1" values="80;80;134;130;130"/>
          <animate attributeName="cy" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.09375;0.145313;0.1625;1" values="80;80;134;130;130"/>
          <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.09375;0.104063;1" values="0;0;1;1"/>
          <animate attributeName="r" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.09375;0.104063;1" values="0;0;9;9"/>
        </circle>
        <circle r="9" fill="#22C55E">
          <animate attributeName="cx" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.1;0.151563;0.16875;1" values="80;80;134;130;130"/>
          <animate attributeName="cy" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.1;0.151563;0.16875;1" values="80;80;26;30;30"/>
          <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.1;0.110313;1" values="0;0;1;1"/>
          <animate attributeName="r" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.1;0.110313;1" values="0;0;9;9"/>
        </circle>
        <circle r="9" fill="#A855F7">
          <animate attributeName="cx" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.10625;0.157813;0.175;1" values="80;80;26;30;30"/>
          <animate attributeName="cy" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.10625;0.157813;0.175;1" values="80;80;26;30;30"/>
          <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.10625;0.116563;1" values="0;0;1;1"/>
          <animate attributeName="r" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.10625;0.116563;1" values="0;0;9;9"/>
        </circle>
        <circle r="9" fill="#22C55E">
          <animate attributeName="cx" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.1125;0.164063;0.18125;1" values="80;80;26;30;30"/>
          <animate attributeName="cy" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.1125;0.164063;0.18125;1" values="80;80;134;130;130"/>
          <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.1125;0.122813;1" values="0;0;1;1"/>
          <animate attributeName="r" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.1125;0.122813;1" values="0;0;9;9"/>
        </circle>

        <!-- spinner -->
        <circle cx="80" cy="80" r="14" fill="none" stroke="url(#grad)" stroke-linecap="round"
                stroke-dasharray="22 66">
          <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.01875;0.03;0.09375;0.125;1" values="0;0;1;1;0;0"/>
          <animate attributeName="r" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.01875;0.03;0.09375;0.125;1" values="5;5;14;14;14;14"/>
          <animateTransform attributeName="transform" type="rotate" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.01875;0.03;0.09375;1" values="0 80 80;0 80 80;120 80 80;760 80 80;760 80 80"/>
        </circle>

        <!-- center dot, with a small highlight pulse before the reveal -->
        <circle cx="80" cy="80" fill="url(#grad)">
          <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.10625;0.1125;0.13125;0.1375;1" values="0;0;0.6;1;1;1"/>
          <animate attributeName="r" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.10625;0.1125;0.13125;0.1375;0.31875;0.340625;0.3625;1"
            values="0;0;5;10;9;9;10;9;9"/>
        </circle>
      </g>

      <!-- ============ solid monogram, revealed under the flash ============ -->
      <g id="monogram">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
          keyTimes="0;0.36875;0.3875;0.775;0.825;1" values="0;0;1;1;0;0"/>

        <rect x="30" width="20" rx="6" fill="#A855F7">
          <animate attributeName="y" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.36875;0.375;0.3875;1" values="40;40;28;30;30"/>
          <animate attributeName="height" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.36875;0.375;0.3875;1" values="80;80;104;100;100"/>
        </rect>
        <rect x="110" width="20" rx="6" fill="#22C55E">
          <animate attributeName="y" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.36875;0.375;0.3875;1" values="40;40;28;30;30"/>
          <animate attributeName="height" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.36875;0.375;0.3875;1" values="80;80;104;100;100"/>
        </rect>
        <line x1="40" y1="30" x2="120" y2="130" stroke="url(#grad)" stroke-linecap="round">
          <animate attributeName="stroke-width" dur="8s" repeatCount="indefinite"
            keyTimes="0;0.36875;0.375;0.3875;1" values="12;12;24;20;20"/>
        </line>
      </g>

      <!-- flash sweeps over the swap from wireframe to solid mark -->
      <circle cx="80" cy="80" r="100" fill="#ffffff">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
          keyTimes="0;0.35625;0.369375;0.39375;1" values="0;0;0.92;0;0"/>
      </circle>

    </g>
  </g>

  <!-- ===================== WORDMARK ===================== -->
  <text x="160" y="225" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="40" font-weight="600" letter-spacing="-0.4" fill="url(#grad)">
    Nexus
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      keyTimes="0;0.40625;0.46625;0.775;0.825;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      keyTimes="0;0.40625;0.46625;1" values="0 10;0 10;0 0;0 0"/>
  </text>

</svg>
