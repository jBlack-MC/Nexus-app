<!DOCTYPE html>
<!-- Play Store feature graphic (1024x500). Brand colours from app/src/main/res/values/colors.xml. -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif}
.bg{width:1024px;height:500px;background:radial-gradient(circle at 18% 30%,#2a1450 0,#0A0A0F 55%);display:flex;align-items:center;padding:0 72px;box-sizing:border-box;gap:56px}
.word{font-size:96px;font-weight:700;background:linear-gradient(90deg,#A855F7,#22C55E);-webkit-background-clip:text;color:transparent;line-height:1}
.tag{color:#E9E6F5;font-size:34px;margin-top:18px;line-height:1.25}
.chips{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.chip{color:#cfc9e6;border:1px solid #3b3550;border-radius:999px;padding:6px 16px;font-size:20px}
</style></head>
<body><div class="bg">
<svg width="240" height="240" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="g" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#22C55E"/></linearGradient></defs>
  <rect width="108" height="108" rx="24" fill="#0A0A0F" stroke="#1F1F27"/>
  <path fill="#A855F7" d="M20.25,20.25h13.5a4.05,4.05 0,0 1,4.05 4.05v59.4a4.05,4.05 0,0 1,-4.05 4.05h-13.5a4.05,4.05 0,0 1,-4.05 -4.05v-59.4a4.05,4.05 0,0 1,4.05 -4.05z"/>
  <path fill="#22C55E" d="M74.25,20.25h13.5a4.05,4.05 0,0 1,4.05 4.05v59.4a4.05,4.05 0,0 1,-4.05 4.05h-13.5a4.05,4.05 0,0 1,-4.05 -4.05v-59.4a4.05,4.05 0,0 1,4.05 -4.05z"/>
  <path d="M27,20.25L81,87.75" stroke="url(#g)" stroke-width="13.5" stroke-linecap="round" fill="none"/>
</svg>
<div>
  <div class="word">Nexus</div>
  <div class="tag">Projects, tasks and habits —<br>online or offline.</div>
  <div class="chips"><span class="chip">English</span><span class="chip">isiZulu</span><span class="chip">Setswana</span><span class="chip">Reminders</span></div>
</div>
</div></body></html>
