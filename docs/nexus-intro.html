<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexus — intro animation</title>
<style>
  :root{
    --purple:#A855F7;
    --green:#22C55E;
    --bg-deep:#050507;
    --bg-icon:#0A0A0F;
    --border:#1F1F27;
    --muted:#6b6b76;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(ellipse at 50% 38%, #121218 0%, var(--bg-deep) 70%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .stage{ display:flex; flex-direction:column; align-items:center; gap:22px; padding:24px; }
  .icon-wrap{ width:clamp(160px, 34vw, 240px); opacity:0; transform:scale(.9); }
  .icon-wrap svg{ display:block; width:100%; height:auto; }

  .wordmark{
    font-size:clamp(28px, 6vw, 40px);
    font-weight:600;
    letter-spacing:-0.01em;
    background:linear-gradient(135deg, var(--purple), var(--green));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    transform:translateY(10px);
  }

  .replay-btn{
    margin-top:6px;
    padding:8px 18px;
    border-radius:999px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.02em;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .replay-btn:hover{ color:#cfcfd6; border-color:#333340; }
  .replay-btn:focus-visible{ outline:2px solid var(--purple); outline-offset:2px; }

  .glow{ animation:breathe 4.5s ease-in-out infinite; transform-origin:80px 80px; }
  @keyframes breathe{ 0%,100%{ opacity:.10; transform:scale(1); } 50%{ opacity:.20; transform:scale(1.08); } }

  /* =========================================================
     BASE (pre-animation) states
     ========================================================= */
  .spinner{ opacity:0; transform-origin:80px 80px; }
  .center-dot{ opacity:0; transform-origin:80px 80px; }
  .dot{ opacity:0; transform-origin:80px 80px; }
  .connect-line{ }
  .cl-left,.cl-right{ stroke-dasharray:100; stroke-dashoffset:100; }
  .cl-diag{ stroke-dasharray:142; stroke-dashoffset:142; }
  .connected-group{ transform-origin:80px 80px; }
  .monogram-group{ opacity:0; transform-origin:80px 80px; }
  .flash{ opacity:0; }

  /* =========================================================
     PLAY sequence
     ========================================================= */
  .stage.play .icon-wrap{ animation:frameIn .5s cubic-bezier(.2,.7,.2,1) forwards; }

  /* phase A — the circle spins */
  .stage.play .spinner{
    animation:spinnerLife .6s cubic-bezier(.3,0,.2,1) .15s forwards,
              spinnerOut .25s ease-in .75s forwards;
  }

  /* phase B — it scatters into the four dots, and settles into the core */
  .stage.play .dot{ animation:scatterOut .55s cubic-bezier(.3,1.5,.4,1) forwards; }
  .stage.play .n1{ animation-delay:.75s; }
  .stage.play .n2{ animation-delay:.80s; }
  .stage.play .n3{ animation-delay:.85s; }
  .stage.play .n4{ animation-delay:.90s; }
  .stage.play .center-dot{ animation:dotIn .25s ease-out .85s forwards; }

  /* phase C — the N draws itself between the dots */
  .stage.play .cl-left{  animation:drawLine .32s ease-out 1.55s forwards; }
  .stage.play .cl-diag{  animation:drawLine .36s ease-out 1.87s forwards; }
  .stage.play .cl-right{ animation:drawLine .32s ease-out 2.23s forwards; }

  /* phase D — highlight, then flash over to the solid monogram */
  .stage.play .connected-group{
    animation:highlightPulse .34s ease-in-out 2.56s forwards,
              groupFadeOut .15s ease-in 2.90s forwards;
  }
  .stage.play .monogram-group{ animation:groupFadeIn .15s ease-out 2.95s forwards; }
  .stage.play .flash{ animation:flashPulse .3s ease-out 2.85s forwards; }

  .stage.play .icon-settle{ animation:settle .24s ease-out 3.15s forwards; }
  .stage.play .wordmark{ animation:wordIn .48s cubic-bezier(.2,.7,.2,1) 3.25s forwards; }

  @keyframes frameIn{ from{ opacity:0; transform:scale(.9);} to{ opacity:1; transform:scale(1);} }
  @keyframes spinnerLife{
    0%{ opacity:0; transform:scale(.3) rotate(0deg); }
    15%{ opacity:1; transform:scale(1) rotate(120deg); }
    100%{ opacity:1; transform:scale(1) rotate(760deg); }
  }
  @keyframes spinnerOut{
    from{ opacity:1; transform:scale(1) rotate(760deg); }
    to{ opacity:0; transform:scale(.4) rotate(760deg); }
  }
  @keyframes dotIn{ from{ opacity:0; transform:scale(.4);} to{ opacity:1; transform:scale(1);} }
  @keyframes scatterOut{
    0%{ opacity:0; transform:translate(0,0) scale(.4); }
    22%{ opacity:1; transform:translate(calc(var(--dx) * 0.22), calc(var(--dy) * 0.22)) scale(1); }
    100%{ opacity:1; transform:translate(var(--dx), var(--dy)) scale(1); }
  }
  @keyframes drawLine{ to{ stroke-dashoffset:0; } }
  @keyframes highlightPulse{
    0%{ transform:scale(1); filter:brightness(1); }
    55%{ transform:scale(1.06); filter:brightness(1.7) drop-shadow(0 0 10px rgba(168,85,247,.55)); }
    100%{ transform:scale(1.02); filter:brightness(1.25); }
  }
  @keyframes groupFadeOut{ from{ opacity:1; } to{ opacity:0; } }
  @keyframes groupFadeIn{ from{ opacity:0; transform:scale(.94);} to{ opacity:1; transform:scale(1);} }
  @keyframes flashPulse{ 0%{ opacity:0; } 35%{ opacity:.92; } 100%{ opacity:0; } }
  @keyframes settle{ 0%{ transform:scale(1);} 50%{ transform:scale(1.035);} 100%{ transform:scale(1);} }
  @keyframes wordIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  /* =========================================================
     REDUCED MOTION — jump straight to the monogram
     ========================================================= */
  .stage.reduced .icon-wrap{ opacity:1; transform:scale(1); }
  .stage.reduced .connected-group{ display:none; }
  .stage.reduced .monogram-group{ opacity:1; transform:scale(1); }
  .stage.reduced .flash{ display:none; }
  .stage.reduced .wordmark{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="icon-wrap">
    <svg class="icon-settle" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#A855F7"/>
          <stop offset="100%" stop-color="#22C55E"/>
        </linearGradient>
        <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="frameClip">
          <rect x="1" y="1" width="158" height="158" rx="31"/>
        </clipPath>
      </defs>

      <rect x="1" y="1" width="158" height="158" rx="31" fill="var(--bg-icon)" stroke="var(--border)" stroke-width="1"/>

      <g clip-path="url(#frameClip)">
        <circle class="glow" cx="80" cy="80" r="66" fill="url(#glowGrad)"/>

        <!-- connected mark: spin → scatter → dots + drawn lines -->
        <g class="connected-group">
          <g class="connect-lines">
            <line class="connect-line cl-left"  x1="30" y1="30" x2="30"  y2="130" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>
            <line class="connect-line cl-diag"  x1="30" y1="30" x2="130" y2="130" stroke="url(#grad)" stroke-width="6" stroke-linecap="round"/>
            <line class="connect-line cl-right" x1="130" y1="30" x2="130" y2="130" stroke="#A855F7" stroke-width="6" stroke-linecap="round"/>
          </g>
          <g class="dots">
            <circle class="dot n1" style="--dx:50px;--dy:50px"   cx="80" cy="80" r="9" fill="#A855F7"/>
            <circle class="dot n2" style="--dx:50px;--dy:-50px"  cx="80" cy="80" r="9" fill="#22C55E"/>
            <circle class="dot n3" style="--dx:-50px;--dy:-50px" cx="80" cy="80" r="9" fill="#A855F7"/>
            <circle class="dot n4" style="--dx:-50px;--dy:50px"  cx="80" cy="80" r="9" fill="#22C55E"/>
          </g>
          <circle class="spinner" cx="80" cy="80" r="14" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 66"/>
          <circle class="center-dot" cx="80" cy="80" r="9" fill="url(#grad)"/>
        </g>

        <!-- solid monogram: revealed under the flash -->
        <g class="monogram-group">
          <rect x="30"  y="30" width="20" height="100" rx="6" fill="#A855F7"/>
          <rect x="110" y="30" width="20" height="100" rx="6" fill="#22C55E"/>
          <line x1="40" y1="30" x2="120" y2="130" stroke="url(#grad)" stroke-width="20" stroke-linecap="round"/>
        </g>

        <circle class="flash" cx="80" cy="80" r="100" fill="#ffffff"/>
      </g>
    </svg>
  </div>

  <div class="wordmark">Nexus</div>

  <button class="replay-btn" id="replayBtn" type="button">Replay</button>
</div>

<script>
  const stage = document.getElementById('stage');
  const replayBtn = document.getElementById('replayBtn');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function play(){
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.add('play');
  }

  if (prefersReduced){
    stage.classList.add('reduced');
    replayBtn.textContent = 'Play intro';
    replayBtn.addEventListener('click', function once(){
      stage.classList.remove('reduced');
      replayBtn.textContent = 'Replay';
      requestAnimationFrame(play);
      replayBtn.removeEventListener('click', once);
      replayBtn.addEventListener('click', play);
    });
  } else {
    requestAnimationFrame(function(){ requestAnimationFrame(play); });
    replayBtn.addEventListener('click', play);
  }
</script>

</body>
</html>
